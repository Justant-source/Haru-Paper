# docs/server/deploy.md 2절: SPA 폴백, /api 프록시(타임아웃 60초, 미리보기 렌더 대기),
# client_max_body_size 30m(가져오기 30MB, 업로드 10MB는 Spring 쪽에서 다시 제한).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    # SSE(기기 깨우기, GET /api/device/events). 기본 proxy_buffering on이면 이벤트가
    # flush되지 않고, 기본 HTTP/1.0 업스트림이면 chunked 스트리밍이 성립하지 않는다.
    # read 타임아웃 90초 = 서버 하트비트(15초)의 6배 여유 — docs/architecture.md 4.3절
    # "타임아웃 순서 불변식" 참고. 적용에는 haru-web 이미지 재빌드가 필요하다(승인 후 별도 단계).
    location = /api/device/events {
        proxy_pass http://haru-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /api/ {
        proxy_pass http://haru-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # PWA 서비스워커·매니페스트는 캐시하지 않는다(항상 최신 버전 받게)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
