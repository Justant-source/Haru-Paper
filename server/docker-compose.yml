name: haru-paper

services:
  haru-db:
    image: mariadb:lts
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${HARU_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: haru_paper
      MARIADB_USER: haru
      MARIADB_PASSWORD: ${HARU_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - haru-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haru-api:
    build: .
    restart: unless-stopped
    depends_on:
      haru-db:
        condition: service_healthy
    # 임시: M3에서 haru-web(nginx)이 추가되면 이 포트 바인딩을 haru-web으로 옮기고 여기서 제거한다
    ports:
      - "127.0.0.1:18080:8080"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://haru-db:3306/haru_paper
      SPRING_DATASOURCE_USERNAME: haru
      SPRING_DATASOURCE_PASSWORD: ${HARU_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - haru-files:/data/haru-files
    mem_limit: 1.5g
    shm_size: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haru-db-backup:
    image: mariadb:lts
    restart: unless-stopped
    profiles:
      - backup
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${HARU_DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - haru-backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  haru-db-data:
  haru-files:
  haru-backups:
