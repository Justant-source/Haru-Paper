name: haru-paper

services:
  haru-db:
    image: mariadb:lts
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${HARU_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: haru_paper
      MARIADB_USER: haru
      MARIADB_PASSWORD: ${HARU_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - haru-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haru-api:
    build: .
    restart: unless-stopped
    depends_on:
      haru-db:
        condition: service_healthy
    # 호스트 포트 없음 — haru-web(nginx)만 외부에 노출한다(docs/server/deploy.md 3절)
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://haru-db:3306/haru_paper
      SPRING_DATASOURCE_USERNAME: haru
      SPRING_DATASOURCE_PASSWORD: ${HARU_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - haru-files:/data/haru-files
    mem_limit: 1.5g
    shm_size: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haru-web:
    build: ../app/web
    restart: unless-stopped
    depends_on:
      - haru-api
    ports:
      - "${HARU_WEB_BIND}:8080"
      # [주의] HARU_WEB_TAILSCALE_BIND는 반드시 이 서버의 tailscale IP:포트여야 한다(0.0.0.0 절대 금지).
      # 비워두면 이 서비스는 뜨지 않는다 — 빈 문자열이 host 주소 없이 포트만 남아 실수로 모든
      # 인터페이스에 열릴 위험을 원천 차단한다. IP:포트 직접 접속이 필요 없으면 .env에서 이 줄과
      # 아래 ports 항목을 함께 지운다.
      - "${HARU_WEB_TAILSCALE_BIND:?HARU_WEB_TAILSCALE_BIND must be set to <tailscale-ip>:<port>, never 0.0.0.0}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haru-db-backup:
    image: mariadb:lts
    restart: unless-stopped
    profiles:
      - backup
    command: /scripts/backup-loop.sh
    depends_on:
      haru-db:
        condition: service_healthy
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${HARU_DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./scripts:/scripts:ro
      - haru-files:/data/haru-files:ro
      - haru-backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  haru-db-data:
  haru-files:
  haru-backups:
