    <div class="mainletterContents">
      <h3 class="mainLetterTit">가장 낮은 곳에서 배우는 것</h3>
      <p>
	"가장 낮은 곳으로 내려가 본 사람만이,<br />
가장 높은 곳의 풍경을 진짜로 이해할 수 있다.<br />
바람이 세게 부는 날일수록,<br />
뿌리 깊은 나무는 오히려 더 단단히 선다.<br />
그러니 오늘 흔들리고 있다면,<br />
그것은 넘어지는 중이 아니라 뿌리를 내리는 중이다."<br />
<br />
<br />
- 이든의《바람이 지나간 자리》중에서 -<br />
<br />
<br />
* 오늘 하루,<br />
누군가의 낮은 자리를 한 번쯤 들여다보는 마음을 가져보세요.<br />
그 자리에서 배우는 것이 생각보다 많습니다.<br />
<br />
오늘도 많이 웃으세요.						</p>
